<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ไพ่ทาโร่ต์ — อ่านดวงชะตาด้วยตัวเอง</title>
  <meta name="description" content="ไพ่ทาโร่ต์ภาษาไทย อ่านดวงชะตาด้วยตัวเอง สำรวจหมวดชีวิต การเงิน การงาน ความรัก ตัวตน ครอบครัว" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">

    <!-- Disclaimer — always visible -->
    <div class="disclaimer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      ไพ่ทาโร่นี้มีไว้เพื่อสำรวจตัวเองเท่านั้น ไม่ใช่คำทำนายหรือคำแนะนำในการตัดสินใจ กรุณาใช้วิจารณญาณของตัวเอง
    </div>

    <!-- Screen: Category Selection -->
    <div id="screen-select" class="screen">
      <div class="screen-inner">
        <h1 class="main-title">ไพ่ทาโร่ต์</h1>
        <p class="main-subtitle">เลือกหมวดชีวิตที่ต้องการสำรวจ — 10 คำถาม</p>
        <div class="category-grid" id="category-grid">
          <button class="category-card" data-cat="การงาน">
            <div class="cat-icon">⚔️</div>
            <span>การงาน</span>
          </button>
          <button class="category-card" data-cat="ความรัก">
            <div class="cat-icon">💞</div>
            <span>ความรัก</span>
          </button>
          <button class="category-card" data-cat="การเงิน">
            <div class="cat-icon">💰</div>
            <span>การเงิน</span>
          </button>
          <button class="category-card" data-cat="ตัวตน">
            <div class="cat-icon">🌟</div>
            <span>ตัวตน</span>
          </button>
          <button class="category-card" data-cat="ครอบครัว">
            <div class="cat-icon">🏠</div>
            <span>ครอบครัว</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Screen: Question -->
    <div id="screen-question" class="screen hidden">
      <div class="screen-inner question-inner">

        <div class="progress-header">
          <div class="progress-bar-wrap">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="progress-label" id="progress-label">คำถามที่ 1 / 10</div>
          <div class="category-badge" id="category-badge"></div>
        </div>

        <div class="question-card" id="question-card">
          <div class="question-number" id="question-number">คำถามที่ 1</div>
          <h2 class="question-text" id="question-text"></h2>
          <p class="question-context" id="question-context"></p>
          <div class="choice-a" id="choice-a"></div>
          <div class="choice-b" id="choice-b"></div>
        </div>

      </div>
    </div>

    <!-- Screen: Summary -->
    <div id="screen-summary" class="screen hidden">
      <div class="screen-inner summary-inner">

        <h2 class="summary-title">การอ่านดวงชะตาของคุณ</h2>
        <p class="summary-category-label" id="summary-category-label"></p>

        <h3 class="summary-card-name" id="summary-card-name"></h3>
        <div class="summary-card-meaning" id="summary-card-meaning"></div>

        <div class="result-card-wrap" id="result-card-wrap">
          <img id="summary-card-img" src="" alt="ไพ่ทาโร่ต์" />
        </div>

        <div class="summary-narrative" id="summary-narrative"></div>

        <div class="donate-section" id="donate-section">
          <div class="donate-label-above" id="donate-label-above">สนับสนุนค่าขนม</div>
          <div class="card-interaction-area" id="card-interaction-area">
            <div class="card-face card-front" id="card-front">
              <div class="state-a-hover-text" id="state-a-hover-text">
                คลิกเพื่อสแกนเพื่อส่งต่อพลังบวกให้ผู้สร้างแอป
              </div>
              <img id="donate-sad-img" src="assets/donation/sad-card.png" alt="สนับสนุน" />
            </div>
            <div class="card-face card-back hidden" id="card-back">
              <div class="qr-info-wrap" id="qr-info-wrap">
                <div class="qr-wrap" id="qr-wrap">
                  <img class="qr-image" src="assets/donation/qr-code.png" alt="รหัสชำระเงิน" />
                </div>
                <div class="qr-actions" id="qr-actions">
                  <button class="qr-hover-btn" id="qr-hover-btn">
                    บันทึกรูปเพื่อสแกน
                  </button>
                  <button class="skip-link" id="skip-link">ไม่สะดวกโอน</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="happy-inline hidden" id="happy-inline"></div>

        <button class="btn-glow hidden" id="restart-btn">เริ่มใหม่</button>

      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
